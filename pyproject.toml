[project]
name = "blank-app-template"
version = "0.1.0"
description = "A simple Streamlit app template."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.61.1",
    "st-gsheets-connection",
]

[tool.uv]
package = false
# .streamlit/secrets.toml


[theme]
primaryColor = "#ff0000"
backgroundColor = "#5158d8"         # Main background color
secondaryBackgroundColor = "#F0F2F6" # Sidebar and widget background
textColor = "#31333F"